# Security-Header (Befund S-4, Sicherheitsaudit 2026-09-11, AND-22/AND-34).
#
# Der CSP-Wert steht EINMAL in dieser map und wird per $csp gesetzt, weil nginx
# `add_header` NICHT in location-Blöcke vererbt, die selbst `add_header` setzen.
# In solchen Blöcken (hier: /assets/ und /) müssen die Header wiederholt werden.
#
# Hosts sind aus dem Code abgeleitet, nicht geraten:
#   'self'                                   eigenes Bundle (Assets, /api-Proxy, sw.js, Fonts via @fontsource)
#   (eigener API-Host)                       nur noetig, wenn VITE_API_BASE auf einen anderen Origin zeigt:
#                                            dann dessen URL in connect-src ergaenzen
#
# Es werden keine Fremd-Skripte eingebunden (Rechtstexte sind statisch im Bundle).
#
# Kein Strict-Transport-Security hier: TLS terminiert VOR diesem Container (Load Balancer /
# Reverse-Proxy / CDN), nginx hört nur auf Port 80. HSTS aus einer
# unverschlüsselten Antwort ist nach RFC 6797 wirkungslos und gehört an den
# TLS-Terminierungspunkt – dort setzen, nicht hier.
#
# Die Capacitor-App (Android) bekommt diese Header NICHT: Sie bündelt `dist` lokal
# (capacitor.config.json: webDir=dist, androidScheme=https) und wird vom WebView-eigenen
# Server unter https://localhost ausgeliefert, nicht von diesem nginx. Ein `http-equiv`-
# Meta-CSP in index.html würde die App dagegen treffen und ist deshalb bewusst nicht gesetzt.
map $host $csp {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; form-action 'self'; worker-src 'self'; manifest-src 'self'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Variabler Upstream + Resolver: so loest nginx 'koch-mcp' erst zur Laufzeit auf
    # (nicht beim Start). Dadurch startet das Image auch dort, wo es keinen koch-mcp
    # gibt (z.B. Cloud Run, wo das Frontend die API direkt per VITE_API_BASE anspricht).
    resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;

    # Security-Header fuer alle Antworten, die keinen eigenen add_header-Block haben
    # (also /api/ und /mcp). "always" -> auch bei 4xx/5xx.
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # REST-API ans Backend weiterreichen (nur genutzt, wenn das Frontend hinter
    # demselben nginx wie die API laeuft, z.B. Home/Compose).
    location /api/ {
        set $koch_backend "http://koch-mcp:8093";
        proxy_pass $koch_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 60m;        # Foto-/Prospekt-Uploads (PDF kann groß sein)
        proxy_request_buffering off;     # großen Upload streamen statt erst puffern
        proxy_read_timeout 300s;         # Verarbeitung bzw. großer Upload
    }

    # MCP optional ueber denselben Origin erreichbar machen
    location /mcp {
        set $koch_mcp "http://koch-mcp:8093";
        proxy_pass $koch_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Gehashte Assets (Dateiname ändert sich pro Build) dürfen lange gecacht werden.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # eigener add_header -> Vererbung greift nicht, Header hier wiederholen (S-4)
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    # SPA-Fallback: index.html, version.json & Co. NIE cachen -> neue Version sofort.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # eigener add_header -> Vererbung greift nicht, Header hier wiederholen (S-4)
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }
}
