name: Android Build

# Baut die Sapio-Android-App (Capacitor-8-Wrapper der koch-web-PWA, targetSdk 36).
# - Debug-APK: sideloadbar zum Testen auf dem Handy.
# - Signierter AAB (app-release.aab): Upload-Artefakt für die Google Play Console.
#   Wird nur gebaut, wenn die Keystore-Secrets im Repo hinterlegt sind
#   (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS).
#   Vor dem Upload wird das AAB per bundletool verifiziert (targetSdk, Signatur).
# Manuell auslösbar (Actions -> Android Build -> Run) oder bei Push auf main (koch-web/**).
# Toolchain: Node 22 + JDK 21 (Pflicht seit Capacitor 7/8) + AGP 8.13 + Gradle 8.14.3.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'koch-web/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    defaults:
      run:
        working-directory: koch-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web-Abhängigkeiten
        run: npm install

      - name: Web bauen
        run: npm run build

      - name: Capacitor sync (Web-Assets -> android/)
        run: npx cap sync android

      - name: Debug-APK bauen
        working-directory: koch-web/android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v5
        with:
          name: sapio-android-debug
          path: koch-web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # --- Signierter Play-Store-AAB (nur mit hinterlegten Keystore-Secrets) ---
      - name: Upload-Keystore aus Secret schreiben
        if: ${{ env.ANDROID_KEYSTORE_PASSWORD != '' }}
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.p12"

      - name: Signierten AAB bauen (bundleRelease)
        if: ${{ env.ANDROID_KEYSTORE_PASSWORD != '' }}
        working-directory: koch-web/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.p12
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: '1.0.0'
        run: ./gradlew --no-daemon bundleRelease

      - name: AAB verifizieren (targetSdk 36, Signatur)
        if: ${{ env.ANDROID_KEYSTORE_PASSWORD != '' }}
        working-directory: koch-web/android
        env:
          BUNDLETOOL_VERSION: '1.18.3'
        run: |
          curl -sSLo "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          AAB=app/build/outputs/bundle/release/app-release.aab
          BT="java -jar $RUNNER_TEMP/bundletool.jar"
          TARGET_SDK=$($BT dump manifest --bundle "$AAB" --xpath '/manifest/uses-sdk/@android:targetSdkVersion' | tr -dc '0-9')
          MIN_SDK=$($BT dump manifest --bundle "$AAB" --xpath '/manifest/uses-sdk/@android:minSdkVersion' | tr -dc '0-9')
          VERSION_CODE=$($BT dump manifest --bundle "$AAB" --xpath '/manifest/@android:versionCode' | tr -dc '0-9')
          echo "AAB: targetSdkVersion=$TARGET_SDK minSdkVersion=$MIN_SDK versionCode=$VERSION_CODE"
          if [ "$TARGET_SDK" != "36" ]; then echo "FEHLER: targetSdk '$TARGET_SDK' – Google Play verlangt 36!"; exit 1; fi
          if [ "$MIN_SDK" != "24" ]; then echo "FEHLER: minSdk '$MIN_SDK' – erwartet 24 (Capacitor 8)!"; exit 1; fi
          echo "--- Signatur-Zertifikat (SHA-256 mit Play Console / Keystore vergleichen) ---"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256:"

      - name: AAB als Artefakt hochladen
        if: ${{ env.ANDROID_KEYSTORE_PASSWORD != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: sapio-android-aab
          path: koch-web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
