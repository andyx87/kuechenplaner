name: CI

# Fuehrt die Backend-Tests aus. Keine Secrets, kein Deployment.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest pytest-asyncio
      - name: Tests
        run: python -m pytest -q tests
