name: CI

# Fuehrt die Backend-Tests aus. Keine Secrets, kein Deployment.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: koch
          POSTGRES_PASSWORD: ci-wegwerf
          POSTGRES_DB: koch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koch" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest pytest-asyncio
      - name: Unit-Tests
        run: python -m pytest -q tests
      - name: Integrationstests (Postgres, RLS, OAuth, MCP)
        env:
          TEST_DATABASE_URL_ADMIN: postgresql://koch:ci-wegwerf@localhost:5432/koch
        run: python -m pytest -q tests_db
